name: 生成 WARP MASQUE 配置

on:
  # [2026-09-21 暂停五源] 定时触发移除，只留手动 dispatch；恢复时重新加回 schedule
  # （原 6 天定时：cron '0 5 */6 * *'）
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名（WARP 后台显示用，默认 gh-actions）
        required: false
        default: gh-actions
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest \
                | jq -r '.tag_name' | sed 's/^v//')
          echo "usque 版本 $VER"
          curl -sL -o usque.zip \
            "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque
          # 没有 config.json 时 usque version 会先打一条 error，不影响结果
          ./usque version 2>/dev/null | grep -i version || true

      - name: 注册设备并生成密钥
        run: |
          set -euo pipefail
          ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}"
          test -s config.json
          # 只打印非敏感字段，密钥不进日志
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          print("endpoint_v4 =", c["endpoint_v4"])
          print("endpoint_v6 =", c["endpoint_v6"])
          print("内网地址 =", c["ipv4"], "/", c["ipv6"])
          PY

      - name: 生成 mihomo 配置
        run: python3 scripts/gen_masque.py config.json dist

      - name: 生成 W2 provider 文件（14 个 198.2/199.2 稳定节点）
        run: python3 scripts/gen_w2_provider.py dist/warp-masque.yaml dist/w2-provider.yaml

      - name: 生成 v2rayN 自包含配置（14 节点 + inbounds + 规则）
        run: python3 scripts/gen_v2rayn_config.py dist/w2-provider.yaml dist/w2-v2rayn.yaml

      - name: 校验配置可加载
        run: |
          set -euo pipefail
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases \
                | grep -o 'https://[^"]*mihomo-linux-amd64-alpha[^"]*\.gz' | head -1)
          curl -sL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          mkdir -p check
          cp dist/warp-masque.yaml check/config.yaml
          # -t 只做配置解析校验，不起服务
          ./mihomo -t -d check
          echo "完整配置校验通过"
          # 校验 v2rayN 自包含配置也可加载
          mkdir -p check2
          cp dist/w2-v2rayn.yaml check2/config.yaml
          ./mihomo -t -d check2
          echo "v2rayN 自包含配置校验通过"

      - name: 提交 W2 provider 与 v2rayN 配置到 main 分支
        run: |
          set -euo pipefail
          cp dist/w2-provider.yaml w2-provider.yaml
          cp dist/w2-v2rayn.yaml w2-v2rayn.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add w2-provider.yaml w2-v2rayn.yaml
          if git diff --quiet --cached -- w2-provider.yaml w2-v2rayn.yaml; then
            echo "W2 provider 与 v2rayN 配置均无变化，跳过提交"
          else
            git commit -m "chore: auto-update W2 provider and v2rayN config $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
            echo "W2 provider 与 v2rayN 配置已更新到 main"
          fi

      - name: 打包凭据与配置
        run: |
          cp config.json dist/usque-config.json
          test -s dist/warp-masque.yaml
          test -s dist/warp-masque-shadowrocket.txt
          test -s dist/w2-provider.yaml
          test -s dist/w2-v2rayn.yaml
          ls -l dist

      - name: 上传 artifact
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-config
          path: dist/
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          if-no-files-found: error

# auto-dispatch 触发验证 20260916
